# FPL grind line, overhang camera (1456 x 1088, 10 fps).
# Calibrated on the 2026-10-29 export. Paths are relative to this file.

camera:
  frame_size: [1456, 1088]        # width, height of the camera frames
  fps: 10
  # camera-angle correction built from the belt rollers (overhang scale-map ...)
  scale_map: scale_maps/fpl-2026-10-29.json

tray:
  # outer tray size in corrected "frame-centre" pixels at HALF resolution (728 x 544 frames)
  outer_size_half_px: [389.97, 288.14]
  # inner opening (where the lip drops into the tray) at FULL resolution
  inner_size_px: [724.01, 525.71]
  inner_corner_radius_px: 45      # rounded inner corners (circle fit on an empty tray)
  inner_shift_px: 4               # inner opening shift along the tray's length (+ = right), from hand-marked empty trays
  # starting guess for the lip width per side (half-res px); only seeds the inner-edge search
  lip_default_half_px: {left: 10.4, right: 18.9, top: 15.3, bottom: 12.9}

tracking:
  step: 1                         # analyse every frame: the belt moves a tray ~180 full-res px per frame at 10 fps
  min_area: 12000                 # meat blob area (half-res px) that counts as a tray
  max_jump_px: 220                # a track accepts a blob this far (half-res px, along the belt) from where it predicts the tray
  max_dy_px: 40                   # ... and this far across the belt
  edge_margin: 12                 # a tray counts as fully in view when its meat is this far from both frame edges
  max_centre_dist: 140            # trays that never come this close to the frame centre are skipped (fragments)
  emit_after_px: 60               # emit a tray once it has moved this far past its most central position
  # R1, the pick zone (full-res x range), OFF until checked on the live stream: if set, a tray is
  # measured only from a frame where its meat is completely inside it, and a tray that never is
  # comes out unmeasured (not_in_pick_zone). If the live feed skips frames, trays can jump past it.
  # To try it: pick_zone_px: [168, 1288]. 1120 px wide = meat (~724) + room so the tray (780) and the 140 px
  # next-tray window on each end stay in view, and > 2 frames of belt movement (~180 px/frame).
  pick_zone_px: null
  # Camera angle. The camera looks at the belt at an angle; meat heaped above the tray rim shows shifted
  # away from the point straight under the camera, which is right of the frame centre (~x 850-900).
  # At the frame centre a tray's left end looks more covered than it is (10-29: median lip cover 9.7 %
  # at x ~730, 3.8 % one frame earlier at x ~990). Two views (side_views_px) is ON: the class cut-offs
  # below were tuned at the frame centre, so with two views fewer trays read mild/small (10-29: mild
  # 16.8 % -> 6.0 %, small 2.6 % -> 1.2 %). Set side_views_px: null and edge_tolerance_px: 0 for the old
  # single frame at the centre.
  # pick_x_px: measure the frame where the tray is nearest this x (full-res) instead of the frame centre.
  pick_x_px: null
  # side_views_px: [x for the tray's left half, x for its right half]: two frames per tray, each half
  # measured where it is shifted least: the left half with the tray near x 1000 (its left end near the point
  # under the camera), the right half near x 550 (its right end near it). At [1000, 730] the two targets were so
  # close that 36-41% of trays got the same frame for both (one photo, at x ~730), and meat pushed to the right
  # end read "large". If one of the two photos fails, the whole tray is read from the frame nearest the centre.
  # Overrides pick_x_px. Two SAM runs per tray.
  side_views_px: [1000, 550]
  # dynamic_split_px: take the first frame with the tray in view (its rightmost position). Tray at x <= this
  # there: that one frame is good for both ends (one photo). Further right: its left half from that frame,
  # its right half from the next one (two photos). The next frame is also the backup if the first cuts the
  # tray. Overrides pick_x_px and side_views_px. Use with edge_tolerance_px: 10.
  dynamic_split_px: null
  # a tray box corner may be this far (full-res px) past the frame edge before the tray is edge_of_view;
  # 10 px is less than the rim's width, so nothing measured is lost
  edge_tolerance_px: 10
  # a "tray" whose meat blob is smooth and skin-coloured is a bare hand over the belt: not reported
  # (10-29: real trays have texture 16-22, bare hands 2-4; see color.skin_like)
  drop_bare_hands: true
  # a tray unreadable only for its outline or the frame edge (not a hand) is measured again on up to
  # this many other frames with the tray in view, nearest first; SAM's other two masks are tried first
  retry_frames: 2
  # ... and a tray unreadable because a worker's hand is over it, on up to this many (the hand often
  # moves away within a frame or two)
  retry_frames_hand: 4

sam:
  model: facebook/sam2.1-hiera-small
  dtype: float32                  # float32 = validated numbers; bfloat16 is ~2x faster on the GPU
  device: auto                    # auto | cuda | cpu | mps

# Customer classes. A tray is
#   large  if meat past the green (outer) edge >= large_past_green_px
#   small  else if lip covered % >= small_lip_cover_pct
#   mild   else if lip covered % >= mild_lip_cover_pct
#   none   otherwise
# Starting values: they split the 10-29 reliable trays ~77 / 18 / 3 / 1 % like the line's slide.
classes:
  mild_lip_cover_pct: 10.5
  small_lip_cover_pct: 18.5
  large_past_green_px: 10000

# floor light per class
light:
  none: green
  mild: yellow
  small: yellow
  large: red

runtime:
  workers: 3                      # CPU processes for the per-tray measurement (each tray ~0.5-0.8 s of one core)
